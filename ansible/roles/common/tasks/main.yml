---
- name: Atualiza cache do apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instala utilitarios de diagnostico e auditoria
  ansible.builtin.apt:
    name:
      - dnsutils
      - iputils-ping
      - curl
      - nmap
      - rsyslog
    state: present

- name: Garante resolucao de nomes interna via /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ item.ip }}\\s"
    line: "{{ item.ip }} {{ item.nome }}"
    state: present
  loop: "{{ hosts_internos }}"

- name: Remove entradas antigas com o mesmo nome e outro IP
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^(?!{{ item.ip | regex_escape }}\\s)\\S+\\s+{{ item.nome }}\\s*$"
    state: absent
  loop: "{{ hosts_internos }}"

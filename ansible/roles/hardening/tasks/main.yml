---
# DevSecOps: seguranca injetada via codigo, nunca aplicada manualmente.

- name: Aplica drop-in de hardening do SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Gerenciado pelo Ansible - nao editar manualmente
      PasswordAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      PermitEmptyPasswords no
      ChallengeResponseAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reinicia sshd

- name: Instala o UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Politica padrao - nega todo trafego de entrada
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Politica padrao - permite trafego de saida
  community.general.ufw:
    direction: outgoing
    policy: allow

# Permissao minima: apenas 22, 80 e 443 expostas.
# A regra 22 vem antes do enable para nao derrubar a conexao do Ansible.
- name: Libera as portas publicas permitidas
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Libera o rsyslog apenas para a rede interna (somente no db)
  community.general.ufw:
    rule: allow
    port: "514"
    proto: "{{ item }}"
    src: "{{ rede_interna }}"
  loop:
    - tcp
    - udp
  when: "'db' in group_names"

- name: Ativa o firewall
  community.general.ufw:
    state: enabled

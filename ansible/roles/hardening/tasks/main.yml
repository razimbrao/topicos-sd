---
- name: Aplica drop-in de hardening do SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      PermitEmptyPasswords no
      ChallengeResponseAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reinicia sshd

- name: Instala o UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Politica padrao - nega todo trafego de entrada
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Politica padrao - permite trafego de saida
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Libera as portas publicas permitidas
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Libera o rsyslog apenas para os nos clientes (somente no db)
  community.general.ufw:
    rule: allow
    port: "514"
    proto: "{{ item.0 }}"
    src: "{{ item.1 }}"
  loop: "{{ ['tcp', 'udp'] | product([bastion_ip, web1_ip, web2_ip]) | list }}"
  when: "'db' in group_names"

- name: Revoga a regra antiga da 514 aberta para a sub-rede inteira
  community.general.ufw:
    rule: allow
    port: "514"
    proto: "{{ item }}"
    src: 192.168.56.0/24
    delete: true
  loop:
    - tcp
    - udp
  when: "'db' in group_names"

- name: Ativa o firewall
  community.general.ufw:
    state: enabled

; Inventario executado a partir do no de controle (VM bastion).
; As chaves sao copiadas de /home/vagrant/machines (shared folder) para
; /home/vagrant/keys, no disco real, porque o vboxsf ignora chmod 600.

[bastion]
192.168.56.10 ansible_connection=local

[web]
192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/keys/web1
192.168.56.12 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/keys/web2

[db]
192.168.56.13 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/keys/db

[all:vars]
db_host=192.168.56.13
web1_ip=192.168.56.11
web2_ip=192.168.56.12
bastion_ip=192.168.56.10
dir_persistente=/var/lib/dados_persistentes

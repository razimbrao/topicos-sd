; Inventario executado a partir do no de controle (VM bastion).
; As chaves privadas vem de ./.vagrant/machines, montado em /home/vagrant/machines.

[bastion]
192.168.56.10 ansible_connection=local

[web]
192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/machines/web1/virtualbox/private_key
192.168.56.12 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/machines/web2/virtualbox/private_key

[db]
192.168.56.13 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/machines/db/virtualbox/private_key

[all:vars]
db_host=192.168.56.13
web1_ip=192.168.56.11
web2_ip=192.168.56.12
rede_interna=192.168.56.0/24
dir_persistente=/var/lib/dados_persistentes

---
- name: Diretorio de configuracao do K3s
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configuracao do K3s agent (IP e flannel na rede privada)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Reinicia k3s-agent

- name: Instala o K3s agent e associa ao control plane
  ansible.builtin.shell: >
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION="{{ k3s_version }}"
    K3S_URL="https://{{ k3s_server_ip }}:6443"
    K3S_TOKEN="{{ hostvars[groups['k3s_masters'][0]].k3s_join_token }}"
    INSTALL_K3S_EXEC="agent" sh -
  args:
    creates: /etc/systemd/system/k3s-agent.service
  no_log: true

- name: Habilita e inicia o k3s-agent (sobe sozinho no boot)
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started

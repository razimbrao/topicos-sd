all:
  vars:
    ansible_user: vagrant
    priv_iface: enp0s8
    vip_address: 192.168.56.254
    k3s_version: v1.31.4+k3s1
    kubectl_version: v1.31.4
    k3s_server_ip: 192.168.56.20
    app_image: localhost/tp2-api:1.0
    nodes:
      - { name: bastion,    ip: 192.168.56.10 }
      - { name: k3s-server, ip: 192.168.56.20 }
      - { name: k3s-worker, ip: 192.168.56.30 }
      - { name: auxiliary,  ip: 192.168.56.40 }
  children:
    proxies:
      hosts:
        bastion:
          ansible_connection: local
          ansible_host: 192.168.56.10
          node_ip: 192.168.56.10
          vrrp_state: MASTER
          vrrp_priority: 101
          vrrp_peer: 192.168.56.40
        auxiliary:
          ansible_host: 192.168.56.40
          ansible_ssh_private_key_file: /home/vagrant/keys/auxiliary
          node_ip: 192.168.56.40
          vrrp_state: BACKUP
          vrrp_priority: 100
          vrrp_peer: 192.168.56.10
    k3s_cluster:
      children:
        k3s_masters:
          hosts:
            k3s-server:
              ansible_host: 192.168.56.20
              ansible_ssh_private_key_file: /home/vagrant/keys/k3s-server
              node_ip: 192.168.56.20
        k3s_workers:
          hosts:
            k3s-worker:
              ansible_host: 192.168.56.30
              ansible_ssh_private_key_file: /home/vagrant/keys/k3s-worker
              node_ip: 192.168.56.30
    backup_storage:
      hosts:
        auxiliary:

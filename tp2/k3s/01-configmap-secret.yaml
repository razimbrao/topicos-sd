# Configuracao nao sensivel (ConfigMap) separada das credenciais (Secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "production"
  PORT: "8080"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "app"
  DB_USER: "app"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
# base64 de "tp2-g6-senha-db" (data em vez de stringData: com stringData o
# kubectl apply sempre reporta "configured" e quebra a idempotencia)
data:
  DB_PASSWORD: dHAyLWc2LXNlbmhhLWRi

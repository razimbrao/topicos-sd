apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Exposta em 30080 em todos os nos; o Nginx dos proxies balanceia entre eles.
apiVersion: v1
kind: Service
metadata:
  name: tp2-api
spec:
  type: NodePort
  selector:
    app: tp2-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080

# IP fixo: a API conecta por IP e nao depende do CoreDNS (que roda no
# k3s-server). Assim, no "vagrant resume", o worker atende sozinho antes de o
# server voltar. Precisa estar na faixa de servicos do K3s (10.43.0.0/16).
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: 10.43.0.100
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Exposta em 30080 em todos os nos; o Nginx dos proxies balanceia entre eles.
apiVersion: v1
kind: Service
metadata:
  name: tp2-api
spec:
  type: NodePort
  selector:
    app: tp2-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
